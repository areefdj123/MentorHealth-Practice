<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="calculator1.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>
<body>
    <div class="megamenu">
        <nav>
            <img id="mainlogo" src="/assets/mentorhealth logo.png" alt="">
            <div class="hamburger"><i class="fa-solid fa-bars" style="color: rgb(8, 76, 255);"></i></div>
            <div class="navlinks">
                <ul id="navlink">
                    <li><a href="">About Us</a></li>
                    <li><a href="">Services</a></li>
                    <li><a href="">BMS</a></li>
                    <li><a href="">Assurance</a></li>
                    <li><a href="">Industries</a></li>
                    <li><a href="">POS System</a></li>
                    <li><a href="">Blogs</a></li>
                </ul>
            </div>
            <div class="mainbutton">
                <button class="btn">Get Started</button>
            </div>
        </nav>
    </div>
    <header>
        <div class="backbutton">
            <a class="backoption" href="">
                <i class="fa-solid fa-arrow-left"></i>
                <p id="backbtnpara">Back</p>
            </a>
        </div>
        <h1 id="mainheading">My Basic Info</h1>
        <div class="container">
            <div class="rightside">
                <div class="firstnameinput">
                    <label for="first-name">First Name</label>
                    <input type="name" id="firstname" name="First Name" placeholder="Name...">
                </div>
                <div class="phonenumberinput">
                    <label for="phone-number">Mobile Number</label>
                    <input type="number" id="mobilenumber" placeholder="Mobile-Number...">
                </div>
                <div class="companyinput">
                    <label for="company-name">Company</label>
                    <input type="name" name="company-name" id="company" placeholder="Company-Name...">
                </div>
                
            </div>
            <div class="leftside">
                <div class="lastnameinput">
                    <label for="lastname">Last Name</label>
                    <input type="name" name="last-name" id="lastname"
                    placeholder="Last-Name">
                </div>
                <div class="emailinput">
                    <label for="email">Email</label>
                    <input type="email" name="Email" id="email" placeholder="Email">
                </div>
            </div>
        </div>
            <div class="buttons">
                <a class="backoption" href="">
                    <button class="backbtn">Back</button>
                </a>
                <a class="nextoption" href="">
                    <button class="nextbtn">Next</button>
                </a>
            </div>
    </header>
</body>
</html>
